name: Build and tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'transaction-service/**'
      - 'consolidation-service/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven verify
        run: mvn -B -ntp clean verify
