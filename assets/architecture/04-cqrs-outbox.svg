<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.bg{fill:#f7fbff}.h{fill:#0b3b74}.t{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:42px;font-weight:700;fill:white}.sub{font-size:24px;fill:#dfefff}.b{fill:#fff;stroke:#6f9fcf;stroke-width:2}.y{fill:#fff2b8;stroke:#c89d00;stroke-width:3}.g{fill:#e8f8ef;stroke:#2e8b57;stroke-width:3}.p{fill:#efe8ff;stroke:#6d4bc3;stroke-width:3}.box{font-size:25px;font-weight:700}.small{font-size:20px}.arrow{stroke:#244a73;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244a73"/></marker></defs><rect class="bg" width="1600" height="900"/><rect class="h" width="1600" height="110"/><text class="title" x="55" y="65">CQRS, Eventos e Transactional Outbox</text><text class="sub" x="55" y="98">O lançamento continua disponível mesmo quando a consolidação falha</text>
<rect class="b" x="80" y="210" rx="20" width="260" height="160"/><text class="t box" x="125" y="265">Transaction API</text><text class="t small" x="125" y="315">POST /transactions</text>
<rect class="y" x="430" y="180" rx="22" width="330" height="220"/><text class="t box" x="485" y="235">Mesma transação DB</text><text class="t small" x="485" y="290">financial_transaction</text><text class="t small" x="485" y="330">+</text><text class="t small" x="485" y="365">outbox_event</text>
<rect class="g" x="850" y="210" rx="20" width="260" height="160"/><text class="t box" x="910" y="265">RabbitMQ</text><text class="t small" x="910" y="315">CloudEvent v1</text>
<rect class="p" x="1200" y="180" rx="22" width="320" height="220"/><text class="t box" x="1245" y="235">Consolidation</text><text class="t small" x="1245" y="290">processed_event</text><text class="t small" x="1245" y="330">daily_balance</text><text class="t small" x="1245" y="365">consumer idempotente</text>
<line class="arrow" x1="340" y1="290" x2="420" y2="290"/><line class="arrow" x1="760" y1="290" x2="840" y2="290"/><line class="arrow" x1="1110" y1="290" x2="1190" y2="290"/>
<rect class="b" x="150" y="520" rx="22" width="1300" height="220"/><text class="t box" x="205" y="575">Garantias</text><text class="t small" x="205" y="625">• HTTP 201 depende do commit PostgreSQL, não do broker</text><text class="t small" x="205" y="665">• Publisher confirma ACK e detecta retorno sem rota</text><text class="t small" x="790" y="625">• Retry limitado + DLQ</text><text class="t small" x="790" y="665">• Eventual consistency + reconciliação</text>
