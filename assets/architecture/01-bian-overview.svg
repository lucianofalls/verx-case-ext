<rect class="y" x="465" y="165" rx="22" width="330" height="150"/><text class="t box" x="505" y="215">Capabilities do case</text><text class="t small" x="505" y="260">Financial Entry Management</text><text class="t small" x="505" y="292">Financial Position Management</text>
