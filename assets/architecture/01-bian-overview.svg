<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff4b4b"/><stop offset="1" stop-color="#d91f26"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2488ff"/><stop offset="1" stop-color="#0866cc"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16b968"/><stop offset="1" stop-color="#078d4c"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="75" text-anchor="middle" font-family="Arial" font-weight="700" font-size="48" fill="#0b2d5c">Visão de Negócio do Case</text>
<text x="800" y="118" text-anchor="middle" font-family="Arial" font-size="25" fill="#52657f">Da necessidade do comerciante às capabilities que geram valor</text>

<!-- lego card 1 -->
<g filter="url(#shadow)">
<rect x="55" y="195" width="430" height="440" rx="28" fill="url(#red)"/>
<circle cx="135" cy="195" r="24" fill="#ff6969"/><circle cx="240" cy="195" r="24" fill="#ff6969"/><circle cx="345" cy="195" r="24" fill="#ff6969"/><circle cx="450" cy="195" r="24" fill="#ff6969"/>
<rect x="85" y="290" width="370" height="300" rx="22" fill="white" opacity=".96"/>
</g>
<circle cx="135" cy="255" r="36" fill="#ffd34f"/><circle cx="135" cy="245" r="15" fill="#784421"/><rect x="118" y="260" width="34" height="35" rx="8" fill="#1c74d9"/>
<text x="200" y="265" font-family="Arial" font-size="31" font-weight="700" fill="white">Necessidade</text>
<text x="200" y="301" font-family="Arial" font-size="31" font-weight="700" fill="white">do comerciante</text>
<text x="115" y="355" font-family="Arial" font-size="23" font-weight="700" fill="#14345d">↕ Registrar créditos e débitos</text>
<text x="115" y="420" font-family="Arial" font-size="23" font-weight="700" fill="#14345d">▥ Consultar saldo diário</text>
<text x="115" y="452" font-family="Arial" font-size="23" font-weight="700" fill="#14345d">   consolidado</text>
<text x="115" y="520" font-family="Arial" font-size="23" font-weight="700" fill="#14345d">⚙ Manter operação mesmo</text>
<text x="115" y="552" font-family="Arial" font-size="23" font-weight="700" fill="#14345d">   com falha no consolidado</text>

<!-- arrow -->
<path d="M500 410 H555 L555 370 L625 440 L555 510 L555 470 H500 Z" fill="#9aa9ba"/>

