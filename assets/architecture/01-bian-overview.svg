<text class="t box" x="170" y="455">Como isso vira software</text>
<rect class="b" x="170" y="510" rx="18" width="300" height="150"/><text class="t box" x="210" y="560">transaction-service</text><text class="t small" x="210" y="605">Command / write side</text><text class="t small" x="210" y="635">Lançamentos + Outbox</text>
