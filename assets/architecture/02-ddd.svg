<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.bg{fill:#f7fbff}.h{fill:#113f78}.t{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:42px;font-weight:700;fill:#fff}.sub{font-size:24px;fill:#dfefff}.box{fill:#fff;stroke:#79a8d8;stroke-width:2}.core{fill:#fff2b8;stroke:#c89d00;stroke-width:3}.vo{fill:#e9f8ef;stroke:#2e8b57;stroke-width:2}.event{fill:#f0e8ff;stroke:#6d4bc3;stroke-width:2}.big{font-size:28px;font-weight:700}.small{font-size:21px}.arrow{stroke:#244a73;stroke-width:5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244a73"/></marker></defs><rect class="bg" width="1600" height="900"/><rect class="h" width="1600" height="110"/><text class="title" x="55" y="65">DDD Estratégico e Tático</text><text class="sub" x="55" y="98">Um Bounded Context, dois deployables e um modelo financeiro explícito</text>
<rect class="core" x="520" y="170" rx="30" width="560" height="150"/><text class="t big" x="620" y="225">Cash Flow / Position Keeping</text><text class="t small" x="660" y="275">Bounded Context candidato</text>
<rect class="box" x="110" y="410" rx="20" width="340" height="220"/><text class="t big" x="160" y="465">Aggregate Root</text><text class="t small" x="160" y="520">FinancialTransaction</text><text class="t small" x="160" y="560">• identidade</text><text class="t small" x="160" y="595">• invariantes</text>
<rect class="vo" x="500" y="410" rx="20" width="300" height="220"/><text class="t big" x="550" y="465">Value Object</text><text class="t small" x="550" y="520">Money</text><text class="t small" x="550" y="560">NUMERIC(19,4)</text><text class="t small" x="550" y="595">moeda + valor</text>
<rect class="event" x="850" y="410" rx="20" width="350" height="220"/><text class="t big" x="900" y="465">Domain Event</text><text class="t small" x="900" y="520">FinancialTransactionRecorded</text><text class="t small" x="900" y="560">fato imutável do domínio</text>
<rect class="box" x="1250" y="410" rx="20" width="260" height="220"/><text class="t big" x="1290" y="465">Read Model</text><text class="t small" x="1290" y="520">DailyBalance</text><text class="t small" x="1290" y="560">projeção CQRS</text>
<line class="arrow" x1="800" y1="320" x2="280" y2="400"/><line class="arrow" x1="800" y1="320" x2="650" y2="400"/><line class="arrow" x1="800" y1="320" x2="1020" y2="400"/><line class="arrow" x1="800" y1="320" x2="1380" y2="400"/>
<text class="t small" x="140" y="735">Reversão/estorno: novo lançamento compensatório com tipo oposto e referência ao original — sem UPDATE/DELETE de negócio.</text>
