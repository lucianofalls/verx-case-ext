<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.bg{fill:#f7fbff}.h{fill:#0b3b74}.t{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:42px;font-weight:700;fill:white}.sub{font-size:24px;fill:#dfefff}.sec{fill:#ffe8e8;stroke:#c94b4b;stroke-width:3}.obs{fill:#e8f2ff;stroke:#3d77b4;stroke-width:3}.test{fill:#e9f8ef;stroke:#2e8b57;stroke-width:3}.box{font-size:26px;font-weight:700}.small{font-size:20px}</style><rect class="bg" width="1600" height="900"/><rect class="h" width="1600" height="110"/><text class="title" x="55" y="65">Segurança, Observabilidade e Testes</text><text class="sub" x="55" y="98">Controles operacionais e evidência automatizada do requisito</text>
<rect class="sec" x="90" y="190" rx="26" width="440" height="510"/><text class="t box" x="145" y="250">Segurança</text><text class="t small" x="145" y="315">OAuth2 / OIDC / JWT</text><text class="t small" x="145" y="360">transactions:write</text><text class="t small" x="145" y="400">transactions:read</text><text class="t small" x="145" y="440">balances:read</text><text class="t small" x="145" y="500">Idempotency-Key</text><text class="t small" x="145" y="540">Secrets fora do código</text>
<rect class="obs" x="580" y="190" rx="26" width="440" height="510"/><text class="t box" x="635" y="250">Observabilidade</text><text class="t small" x="635" y="315">Micrometer + Actuator</text><text class="t small" x="635" y="355">OpenTelemetry Collector</text><text class="t small" x="635" y="395">Jaeger</text><text class="t small" x="635" y="455">consolidation lag</text><text class="t small" x="635" y="495">Outbox pending / age</text><text class="t small" x="635" y="535">RabbitMQ queue / DLQ depth</text><text class="t small" x="635" y="575">traceId / spanId</text>
<rect class="test" x="1070" y="190" rx="26" width="440" height="510"/><text class="t box" x="1125" y="250">Validação</text><text class="t small" x="1125" y="315">JUnit + Testcontainers</text><text class="t small" x="1125" y="355">E2E em 6 fases</text><text class="t small" x="1125" y="395">falha do serviço e do DB</text><text class="t small" x="1125" y="435">reversão + reconciliação</text><text class="t small" x="1125" y="495">k6 constant-arrival-rate</text><text class="t small" x="1125" y="535">50 req/s por 5 minutos</text><text class="t small" x="1125" y="575">erro &lt; 5% / p95 &lt; 500 ms</text>
</svg>