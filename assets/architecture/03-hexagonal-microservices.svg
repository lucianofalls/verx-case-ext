<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.bg{fill:#f7fbff}.h{fill:#0d3b70}.t{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:42px;font-weight:700;fill:white}.sub{font-size:24px;fill:#dfefff}.box{font-size:25px;font-weight:700}.small{font-size:20px}.a{fill:#dcecff;stroke:#3f7fc0;stroke-width:3}.p{fill:#e9f8ef;stroke:#2e8b57;stroke-width:3}.app{fill:#fff1b8;stroke:#c89d00;stroke-width:3}.dom{fill:#ffe0e0;stroke:#c94b4b;stroke-width:3}.arrow{stroke:#244a73;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244a73"/></marker></defs><rect class="bg" width="1600" height="900"/><rect class="h" width="1600" height="110"/><text class="title" x="55" y="65">Arquitetura Hexagonal e Microserviços</text><text class="sub" x="55" y="98">Domínio isolado; infraestrutura conectada por portas e adaptadores</text>
<rect class="a" x="110" y="190" rx="35" width="650" height="520"/><rect class="p" x="180" y="250" rx="30" width="510" height="390"/><rect class="app" x="250" y="315" rx="25" width="370" height="260"/><rect class="dom" x="330" y="380" rx="20" width="210" height="130"/>
<text class="t box" x="135" y="235">Adapters</text><text class="t box" x="210" y="295">Ports</text><text class="t box" x="305" y="360">Application</text><text class="t box" x="385" y="435">Domain</text><text class="t small" x="365" y="475">regras de negócio</text>
<rect class="a" x="865" y="205" rx="22" width="300" height="180"/><text class="t box" x="910" y="255">transaction-service</text><text class="t small" x="910" y="305">REST → application → ports</text><text class="t small" x="910" y="340">PostgreSQL / RabbitMQ</text>
<rect class="p" x="1230" y="205" rx="22" width="300" height="180"/><text class="t box" x="1265" y="255">consolidation-service</text><text class="t small" x="1265" y="305">listener + query API</text><text class="t small" x="1265" y="340">projection / persistence</text>
<line class="arrow" x1="760" y1="300" x2="855" y2="300"/><line class="arrow" x1="1165" y1="300" x2="1220" y2="300"/>
<rect class="dom" x="940" y="500" rx="24" width="520" height="155"/><text class="t box" x="1040" y="555">1 Bounded Context</text><text class="t small" x="1000" y="600">Cash Flow / Position Keeping</text><text class="t small" x="980" y="635">2 deployables ≠ 2 domínios semânticos</text>
