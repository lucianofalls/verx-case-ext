<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><style>.bg{fill:#f7fbff}.h{fill:#0d3b70}.t{font-family:Arial,sans-serif;fill:#102a43}.title{font-size:42px;font-weight:700;fill:white}.sub{font-size:24px;fill:#dfefff}.db{fill:#e7f1ff;stroke:#3d77b4;stroke-width:3}.read{fill:#e9f8ef;stroke:#2e8b57;stroke-width:3}.box{font-size:25px;font-weight:700}.small{font-size:20px}.arrow{stroke:#244a73;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#244a73"/></marker></defs><rect class="bg" width="1600" height="900"/><rect class="h" width="1600" height="110"/><text class="title" x="55" y="65">Banco de Dados, Fonte de Verdade e Projeções</text><text class="sub" x="55" y="98">Separação de ownership com PostgreSQL e leitura otimizada</text>
<rect class="db" x="120" y="190" rx="25" width="560" height="470"/><text class="t box" x="175" y="245">schema transactions</text><text class="t small" x="175" y="300">financial_transaction</text><text class="t small" x="205" y="340">transaction_id UUID</text><text class="t small" x="205" y="375">amount NUMERIC(19,4)</text><text class="t small" x="205" y="410">business_date</text><text class="t small" x="205" y="445">idempotency_key UNIQUE</text><text class="t small" x="175" y="505">outbox_event</text><text class="t small" x="205" y="545">published_at / retry_count</text><text class="t small" x="175" y="605">Fonte de verdade dos lançamentos</text>
<rect class="read" x="920" y="190" rx="25" width="560" height="470"/><text class="t box" x="975" y="245">schema consolidation</text><text class="t small" x="975" y="300">processed_event</text><text class="t small" x="1005" y="340">event_id UNIQUE</text><text class="t small" x="975" y="405">daily_balance</text><text class="t small" x="1005" y="445">merchant_id + business_date + currency</text><text class="t small" x="1005" y="485">total_credits / total_debits</text><text class="t small" x="1005" y="525">balance</text><text class="t small" x="975" y="605">Read model reconstruível</text>
<line class="arrow" x1="680" y1="420" x2="910" y2="420"/><text class="t small" x="735" y="390">eventos</text>
<text class="t small" x="230" y="755">Reconciliation job compara SUM(financial_transaction) com daily_balance por merchant/date/currency.</text>
</svg>